[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic-descent"
version = "0.20.0"
description = "Optimization algorithm based on gradient descent over a dynamic landscape perturbed by spatially correlated noise."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Mario R. Carbonell"}
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
torch = [
    "torch>=1.12.0",
]
benchmark = [
    "matplotlib>=3.5.0",
    "cma>=3.2.0",
    "noise>=1.2.2",
]
dev = [
    "pytest>=7.0.0",
    "matplotlib>=3.5.0",
    "torch>=1.12.0",
    "cma>=3.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

